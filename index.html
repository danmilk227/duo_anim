<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duo Tilt Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="scene">
        <div id="screen">
            <div class="bg layer-sharp"></div>
            <div class="bg layer-blur"></div>
            <div class="layer-shadow"></div>
        </div>
    </div>

    <div id="start-overlay">
        <div class="start-content">
            <h1>Foldable Perspective Effect</h1>
            <p>Move your mouse or tilt your device to see the effect.</p>
            <button id="start-btn">Enable Gyroscope</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
